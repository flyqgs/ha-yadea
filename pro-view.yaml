  - type: grid
    cards:
    - type: heading
      heading: 双车对比
      icon: mdi:compare-horizontal
      heading_style: subtitle
      card_mod:
        style: |
          ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }
          .title { color: #e2e8f0 !important; font-weight: 600 !important; letter-spacing: .6px; }
          ha-icon { color: #60a5fa !important; }
    - type: markdown
      content: |
        {% set sb = states('sensor.bai_sha_ii_g_battery')|float(0) %}
        {% set sl = states('sensor.long_ting_70_y_g_battery')|float(0) %}
        {% set mb = states('sensor.bai_sha_ii_g_mileage_this_month')|float(0) %}
        {% set ml = states('sensor.long_ting_70_y_g_mileage_this_month')|float(0) %}
        {% set tb = states('sensor.bai_sha_ii_g_total_mileage')|float(0) %}
        {% set tl = states('sensor.long_ting_70_y_g_total_mileage')|float(0) %}
        {% set mmx = [mb, ml, 1]|max %}
        {% set tmx = [tb, tl, 1]|max %}
        <div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="flex:1;text-align:right;font-size:11px;font-weight:700;color:#7dd3fc;letter-spacing:.5px">白鲨Ⅱ</div><div style="width:100px"></div><div style="flex:1;font-size:11px;font-weight:700;color:#22d3ee;letter-spacing:.5px">龙霆70</div></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ sb|round(0)|int }}%;margin-left:auto;border-radius:99px;background:linear-gradient(270deg,#6366f1,#38bdf8)"></div></div><div style="width:100px;text-align:center"><div style="font-size:10px;letter-spacing:1px;color:#94a3b8">电量</div><div style="font-size:13px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">{{ sb|round(0)|int }}<span style="color:#475569;font-weight:400"> / </span>{{ sl|round(0)|int }}</div></div><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ sl|round(0)|int }}%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#22d3ee)"></div></div></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ (mb/mmx*100)|round(1) }}%;margin-left:auto;border-radius:99px;background:linear-gradient(270deg,#6366f1,#38bdf8)"></div></div><div style="width:100px;text-align:center"><div style="font-size:10px;letter-spacing:1px;color:#94a3b8">本月 km</div><div style="font-size:13px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">{{ mb|round(1) }}<span style="color:#475569;font-weight:400"> / </span>{{ ml|round(1) }}</div></div><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ (ml/mmx*100)|round(1) }}%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#22d3ee)"></div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ (tb/tmx*100)|round(1) }}%;margin-left:auto;border-radius:99px;background:linear-gradient(270deg,#6366f1,#38bdf8)"></div></div><div style="width:100px;text-align:center"><div style="font-size:10px;letter-spacing:1px;color:#94a3b8">累计 km</div><div style="font-size:13px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">{{ tb|round(1) }}<span style="color:#475569;font-weight:400"> / </span>{{ tl|round(1) }}</div></div><div style="flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden"><div style="height:100%;width:{{ (tl/tmx*100)|round(1) }}%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#22d3ee)"></div></div></div></div>
      card_mod:
        style: |
          ha-card {
            border: 1px solid rgba(120,160,255,0.12);
            border-radius: 22px;
            background: linear-gradient(158deg, rgba(18,27,45,0.94) 0%, rgba(9,14,26,0.96) 100%);
            box-shadow: 0 12px 30px rgba(2,6,23,0.40);
          }
          ha-markdown { padding: 0 !important; }
    - type: heading
      heading: 车辆档案
      icon: mdi:card-account-details-outline
      heading_style: subtitle
      card_mod:
        style: |
          ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }
          .title { color: #e2e8f0 !important; font-weight: 600 !important; letter-spacing: .6px; }
          ha-icon { color: #60a5fa !important; }
    - type: markdown
      content: |
        {% macro a(e, k) %}{% set v = state_attr(e, k) %}{{ v if v not in [None, '', 'None'] else '—' }}{% endmacro %}
