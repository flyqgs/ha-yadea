- title: 进阶版
  path: advanced
  icon: mdi:auto-fix
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: 白鲨Ⅱ-G PRO
      secondary: 电量 {{ states('sensor.bai_sha_ii_g_battery') }}% · 续航 {{ states('sensor.bai_sha_ii_g_remaining_range') }} km
      icon: mdi:motorbike-electric
      icon_color: blue
      tap_action:
        action: more-info
        entity: sensor.bai_sha_ii_g_battery
      card_mod:
        style: "ha-card {\n  border: none;\n  min-height: 148px;\n  padding: 14px 18px;\n  border-radius: 20px;\n  overflow: hidden;\n  background: linear-gradient(90deg, rgba(10,18,32,0.96) 0%, rgba(10,18,32,0.72)\
          \ 42%, rgba(10,18,32,0.18) 100%), url(\"https://tsposs.yadeaiot.com.cn/tsp/vehicle/static/c04653a1cc164f59b6178c7445a4dbc5.png\") right center / contain no-repeat, linear-gradient(135deg, #1e293b,\
          \ #0b1220);\n  box-shadow: 0 10px 28px rgba(2,6,23,0.35);\n}\nha-card .primary {\n  color: #ffffff;\n  font-weight: 700;\n  font-size: 1.12rem;\n  letter-spacing: 0.3px;\n}\nha-card .secondary\
          \ {\n  color: rgba(226,232,240,0.86);\n  font-size: 0.92rem;\n}\nha-card mushroom-shape-icon {\n  --icon-size: 46px;\n  background: rgba(59,130,246,0.25) !important;\n}\nha-card .icon {\n  color:\
          \ #7dd3fc !important;\n}\n"
    - type: custom:mushroom-chips-card
      chips:
      - type: template
        icon: mdi:battery-high
        icon_color: green
        content: '{{ states(''sensor.bai_sha_ii_g_battery'') }}%'
        tap_action:
          action: more-info
          entity: sensor.bai_sha_ii_g_battery
      - type: template
        icon: mdi:map-marker-distance
        icon_color: blue
        content: '{{ states(''sensor.bai_sha_ii_g_remaining_range'') }} km'
        tap_action:
          action: more-info
          entity: sensor.bai_sha_ii_g_remaining_range
      - type: template
