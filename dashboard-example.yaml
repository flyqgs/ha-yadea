# 雅迪电动车仪表盘（已填入你账号的真实实体 ID，可直接使用）
# 使用：HA 概览页 → 右上角"⋯" → 编辑仪表盘 → "⋯" → 用 YAML 编辑 → 全部替换为本文件内容
# 或：设置 → 仪表盘 → 添加仪表盘 → 打开后"⋯" → 用 YAML 编辑 → 粘贴

title: 雅迪电动车
views:
  - title: 车辆总览
    path: yadea
    cards:
      # ══════════ 白鲨Ⅱ-G PRO ══════════
      - type: vertical-stack
        cards:
          - type: picture
            title: 白鲨Ⅱ-G PRO
            image: https://tsposs.yadeaiot.com.cn/tsp/vehicle/static/c04653a1cc164f59b6178c7445a4dbc5.png
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.bai_sha_ii_g_battery
                name: 电量
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 0
                needle: false
              - type: gauge
                entity: sensor.bai_sha_ii_g_remaining_range
                name: 续航 (km)
                min: 0
                max: 200
                severity:
                  green: 100
                  yellow: 50
                  red: 0
                needle: false
          - type: horizontal-stack
            cards:
              - type: statistic
                entity: sensor.bai_sha_ii_g_mileage_this_month
                name: 本月里程 (km)
                stat_type: max
              - type: statistic
                entity: sensor.bai_sha_ii_g_total_mileage
                name: 累计里程 (km)
                stat_type: max
              - type: statistic
                entity: sensor.bai_sha_ii_g_total_co2_saved
                name: 碳减排 (kg)
                stat_type: max
          - type: entities
            title: 能耗与状态
            entities:
              - entity: sensor.bai_sha_ii_g_yesterday_charge
                name: 昨日充电 (kWh)
              - entity: sensor.bai_sha_ii_g_yesterday_consumption
                name: 昨日用电 (kWh)
              - entity: sensor.bai_sha_ii_g_7_day_charge
                name: 近7天充电 (kWh)
              - entity: sensor.bai_sha_ii_g_7_day_consumption
                name: 近7天用电 (kWh)
              - entity: sensor.bai_sha_ii_g_last_report
                name: 最后上报

      # ══════════ 冠能龙霆70 ══════════
      - type: vertical-stack
        cards:
          - type: picture
            title: 冠能龙霆70 都市劲享版
            image: https://tsposs.yadeaiot.com.cn/tsp/vehicle/static/a0c7a1a5da8b4e9b820a8cd2b4ce894b.png
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.long_ting_70_y_g_battery
                name: 电量
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 0
                needle: false
              - type: gauge
                entity: sensor.long_ting_70_y_g_remaining_range
                name: 续航 (km)
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 0
                needle: false
          - type: horizontal-stack
            cards:
              - type: statistic
                entity: sensor.long_ting_70_y_g_mileage_this_month
                name: 本月里程 (km)
                stat_type: max
              - type: statistic
                entity: sensor.long_ting_70_y_g_total_mileage
                name: 累计里程 (km)
                stat_type: max
              - type: statistic
                entity: sensor.long_ting_70_y_g_total_co2_saved
                name: 碳减排 (kg)
                stat_type: max
          - type: entities
            title: 能耗与状态
            entities:
              - entity: sensor.long_ting_70_y_g_yesterday_charge
                name: 昨日充电 (kWh)
              - entity: sensor.long_ting_70_y_g_yesterday_consumption
                name: 昨日用电 (kWh)
              - entity: sensor.long_ting_70_y_g_7_day_charge
                name: 近7天充电 (kWh)
              - entity: sensor.long_ting_70_y_g_7_day_consumption
                name: 近7天用电 (kWh)
              - entity: sensor.long_ting_70_y_g_last_report
                name: 最后上报

      # ══════════ 车辆详情（诊断信息） ══════════
      - type: entities
        title: 车辆详情
        entities:
          - entity: sensor.bai_sha_ii_g_vehicle_info
            name: 白鲨Ⅱ 车辆信息
            icon: mdi:motorbike
          - entity: sensor.long_ting_70_y_g_vehicle_info
            name: 龙霆70 车辆信息
            icon: mdi:motorbike
          - entity: sensor.bai_sha_ii_g_battery_count
            name: 白鲨Ⅱ 电池数量
          - entity: sensor.long_ting_70_y_g_battery_count
            name: 龙霆70 电池数量
          - entity: sensor.bai_sha_ii_g_iot_days_remaining
            name: 白鲨Ⅱ 物联卡剩余天数
          - entity: sensor.long_ting_70_y_g_iot_days_remaining
            name: 龙霆70 物联卡剩余天数
          - entity: sensor.bai_sha_ii_g_iot_card_expires
            name: 白鲨Ⅱ 物联卡到期日
          - entity: sensor.long_ting_70_y_g_iot_card_expires
            name: 龙霆70 物联卡到期日
          - entity: image.bai_sha_ii_g
            name: 白鲨Ⅱ 图片实体
          - entity: image.long_ting_70_y_g
            name: 龙霆70 图片实体

