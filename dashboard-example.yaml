# 雅迪电动车仪表盘 - 视图：总览·经典 / 精简总览（磁贴+车辆图浮动信息）/ 状态速览（全屏双车图文卡）
title: 雅迪电动车
views:
- title: 总览 · 经典
  path: classic
  cards:
  - type: vertical-stack
    cards:
    - type: picture
      title: 白鲨Ⅱ-G PRO
      image_entity: image.bai_sha_ii_g
    - type: horizontal-stack
      cards:
      - type: gauge
        entity: sensor.bai_sha_ii_g_battery
        name: 电量
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 20
          red: 0
        needle: false
